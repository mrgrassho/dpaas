services:
  scrapers:
    build:
      context: .
      dockerfile: scrapers/Dockerfile
    command: python -m scraper.run_etl --spider all --database ${CONTAINER_DUCKDB_PATH:-/data/dpaas.duckdb}
    environment:
      DUCKDB_PATH: ${CONTAINER_DUCKDB_PATH:-/data/dpaas.duckdb}
      LLM_EXTRACTOR: ${LLM_EXTRACTOR:-0}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.0-flash-001}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-dpaas-price-research/0.1}
    volumes:
      - ./data:/data
      - ./notebooks:/app/notebooks:ro

  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8082:80"
    environment:
      DUCKDB_PATH: ${CONTAINER_DUCKDB_PATH:-/data/dpaas.duckdb}
      LLM_EXTRACTOR: ${LLM_EXTRACTOR:-0}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.0-flash-001}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./data:/data

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    command: sh -c "python -m compileall -q api scrapers dpaas_core tests && pytest -q"
    environment:
      DUCKDB_PATH: ${CONTAINER_DUCKDB_PATH:-/data/dpaas.duckdb}
      PYTHONPATH: /app/tests/_shims:/app:/app/scrapers:/app/api
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    volumes:
      - ./data:/data
